<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MedTracker AI — অ্যাসিস্ট্যান্ট</title>
<style>
  :root {
    --bg: #0B1120;
    --card: #111827;
    --card2: #1E293B;
    --text: #E5E7EB;
    --muted: #94A3B8;
    --accent: #8B5CF6;
    --accent2: #6366F1;
    --border: #1F2937;
  }
  [data-theme="light"] {
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --card2: #F1F5F9;
    --text: #0F172A;
    --muted: #64748B;
    --border: #E2E8F0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Noto Sans Bengali', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.3s, color 0.3s;
  }

  /* Header */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
  }
  .logo-icon {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 18px;
  }
  .header-actions { display: flex; gap: 10px; }
  .icon-btn {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 38px; height: 38px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .icon-btn:hover { border-color: var(--accent); }

  /* Chat area */
  main {
    flex: 1;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .chat-card {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 60vh;
  }

  .chat-messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  .msg {
    display: flex;
    gap: 10px;
    max-width: 85%;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    color: white;
  }
  .avatar.bot { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .avatar.user { background: linear-gradient(135deg, #10B981, #059669); }

  .bubble {
    background: var(--card2);
    padding: 11px 15px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.6;
    word-wrap: break-word;
    white-space: pre-wrap;
    border: 1px solid var(--border);
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
  }
  .bubble img {
    max-width: 240px;
    max-height: 240px;
    border-radius: 10px;
    margin-bottom: 8px;
    display: block;
  }

  /* Typing indicator */
  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing span {
    width: 7px; height: 7px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-7px); opacity: 1; }
  }

  /* Suggestions */
  .suggestions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 0 20px 12px;
  }
  .sugg-btn {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .sugg-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Input area */
  .chat-input-area {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    background: var(--card);
  }
  .file-preview {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .file-preview img {
    width: 44px; height: 44px;
    object-fit: cover;
    border-radius: 8px;
  }
  .file-preview button {
    margin-left: auto;
    background: transparent;
    border: none;
    color: #EF4444;
    cursor: pointer;
    font-size: 18px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .input-row textarea {
    flex: 1;
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 11px 14px;
    font-family: inherit;
    font-size: 15px;
    resize: none;
    max-height: 120px;
    min-height: 44px;
    outline: none;
    transition: border 0.2s;
  }
  .input-row textarea:focus { border-color: var(--accent); }

  .send-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    width: 44px; height: 44px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
  }
  .send-btn:hover { transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .attach-btn {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 44px; height: 44px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .attach-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Responsive */
  @media (max-width: 640px) {
    main { padding: 12px; }
    .msg { max-width: 92%; }
    .bubble { font-size: 14px; }
    .logo span { font-size: 15px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🩺</div>
    <span>MedTracker AI</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" title="থিম পরিবর্তন">🌙</button>
    <button class="icon-btn" onclick="window.location.href='https://serakib.github.io/Medical-Admission-Tracker/'" title="ফিরে যান">←</button>
  </div>
</header>

<main>
  <div class="chat-card">
    <div class="chat-messages" id="messages">
      <div class="msg bot">
        <div class="avatar bot">AI</div>
        <div class="bubble">আসসালামু আলাইকুম! 👋<br>আমি MedTracker AI। মেডিকেল ভর্তি সম্পর্কিত যেকোনো প্রশ্ন করতে পারেন। ছবি পাঠিয়ে প্রশ্নও করতে পারেন (📎 আইকনে ক্লিক করে)।</div>
      </div>
    </div>

    <div class="suggestions" id="suggestions">
      <button class="sugg-btn" onclick="askSuggestion('মেডিকেল ভর্তি পরীক্ষার সিলেবাস কী?')">📚 সিলেবাস</button>
      <button class="sugg-btn" onclick="askSuggestion('ভর্তি পরীক্ষার জন্য কীভাবে প্রস্তুতি নেব?')">✍️ প্রস্তুতি</button>
      <button class="sugg-btn" onclick="askSuggestion('মেডিকেল কলেজের লিস্ট দাও')">🏥 কলেজ লিস্ট</button>
    </div>

    <div class="chat-input-area">
      <div class="file-preview" id="filePreview">
        <img id="previewImg" src="" alt="" />
        <span id="previewName"></span>
        <button onclick="clearFile()" title="মুছে ফেলুন">✕</button>
      </div>
      <div class="input-row">
        <label for="fileInput" class="attach-btn" title="ছবি পাঠান">📎</label>
        <input type="file" id="fileInput" accept="image/*" hidden />
        <textarea id="userInput" rows="1" placeholder="আপনার প্রশ্ন লিখুন..."></textarea>
        <button class="send-btn" id="sendBtn" title="পাঠান">➤</button>
      </div>
    </div>
  </div>
</main>

<script>
// ⚙️ Render-এর URL
const BACKEND_URL = "https://ai-assisstant-2.onrender.com";

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const fileInput = document.getElementById('fileInput');
const filePreview = document.getElementById('filePreview');
const previewImg = document.getElementById('previewImg');
const previewName = document.getElementById('previewName');
const themeBtn = document.getElementById('themeBtn');
const suggestionsEl = document.getElementById('suggestions');

let attachedFile = null;
let isSending = false;

/* ===== থিম টগল ===== */
const savedTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
themeBtn.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  themeBtn.textContent = next === 'dark' ? '🌙' : '☀️';
  localStorage.setItem('theme', next);
});

/* ===== ফাইল হ্যান্ডলিং ===== */
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (file.size > 5 * 1024 * 1024) {
    alert('ছবির সাইজ ৫ MB এর বেশি হতে পারবে না');
    fileInput.value = '';
    return;
  }

  attachedFile = file;
  const reader = new FileReader();
  reader.onload = (ev) => {
    previewImg.src = ev.target.result;
    previewName.textContent = file.name;
    filePreview.style.display = 'flex';
  };
  reader.readAsDataURL(file);
});

function clearFile() {
  attachedFile = null;
  fileInput.value = '';
  filePreview.style.display = 'none';
  previewImg.src = '';
}

/* ===== মেসেজ পাঠানো ===== */
async function sendMessage() {
  if (isSending) return;
  const text = inputEl.value.trim();
  if (!text && !attachedFile) return;

  isSending = true;
  sendBtn.disabled = true;

  // ইউজার মেসেজ দেখান
  addMessage('user', text, attachedFile);
  inputEl.value = '';
  inputEl.style.height = 'auto';

  const fileToSend = attachedFile;
  clearFile();
  suggestionsEl.style.display = 'none';

  // টাইপিং ইন্ডিকেটর
  const typingEl = addTyping();

  try {
    const formData = new FormData();
    formData.append('message', text || '');
    if (fileToSend) formData.append('image', fileToSend);

    const res = await fetch(`${BACKEND_URL}/api/chat`, {
      method: 'POST',
      body: formData
    });

    const data = await res.json();
    typingEl.remove();

    if (!res.ok) {
      addMessage('bot', '❌ এরর: ' + (data.error || 'অজানা সমস্যা'));
    } else {
      addMessage('bot', data.reply);
    }
  } catch (err) {
    typingEl.remove();
    addMessage('bot', '❌ সার্ভারে সংযোগ করা যাচ্ছে না। কিছুক্ষণ পর চেষ্টা করুন।');
  } finally {
    isSending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function addMessage(role, text, file) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role === 'user' ? 'user' : 'bot'}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role === 'user' ? 'user' : 'bot'}`;
  avatar.textContent = role === 'user' ? '👤' : 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (file) {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    bubble.appendChild(img);
  }

  if (text) {
    const p = document.createElement('div');
    p.textContent = text;
    bubble.appendChild(p);
  }

  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrap;
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.innerHTML = `
    <div class="avatar bot">AI</div>
    <div class="bubble">
      <div class="typing"><span></span><span></span><span></span></div>
    </div>`;
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrap;
}

function askSuggestion(text) {
  inputEl.value = text;
  sendMessage();
}

/* ===== ইভেন্ট ===== */
sendBtn.addEventListener('click', sendMessage);

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

inputEl.focus();
</script>

</body>
</html>
